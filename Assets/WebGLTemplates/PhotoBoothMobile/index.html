<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Photo Booth</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}#unity-canvas{width:100%;height:100%;display:block;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#20313d}progress{width:min(320px,80vw);margin-top:20px}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><h1>AI Photo Booth</h1><span id="message">Loading your photo booth…</span><progress id="progress" max="1" value="0"></progress></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
const canvas=document.getElementById('unity-canvas');
createUnityInstance(canvas,{
 dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
 streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
 devicePixelRatio:Math.min(window.devicePixelRatio||1,2),matchWebGLToCanvasSize:true
}, value=>document.getElementById('progress').value=value)
.then(instance=>{window.boothInstance=instance;document.getElementById('loading').style.display='none';})
.catch(error=>{document.getElementById('message').textContent='Unable to load the booth. Try Safari or Chrome, then reload. '+error;});
</script>
</body></html>
